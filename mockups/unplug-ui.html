<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unplug — UI mockups</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#111; color:#fff; font-family: "Segoe UI", Roboto, system-ui, sans-serif; padding: 40px 24px 70px; }
  h1 { font-weight: 300; font-size: 30px; text-align:center; letter-spacing: 1px; }
  .sub { text-align:center; color:#7a7a7a; font-family: Consolas, monospace; font-size: 12px; letter-spacing: 2px; margin: 8px 0 10px; text-transform: uppercase; }
  h2 { font-family: Consolas, monospace; font-weight: 400; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color:#bbb;
       text-align:center; margin: 56px 0 28px; }
  h2::before, h2::after { content:""; display:inline-block; width: 60px; height:1px; background:#333; vertical-align: middle; margin: 0 14px; }
  .row { display:flex; flex-wrap:wrap; gap: 40px; justify-content:center; }
  figure { display:flex; flex-direction:column; align-items:center; gap: 14px; }
  figcaption { font-family: Consolas, monospace; font-size: 12px; letter-spacing: 2px; color:#aaa; text-transform: uppercase; text-align:center; max-width: 330px; line-height: 1.6; }
  figcaption span { display:block; color:#666; letter-spacing: 0.5px; text-transform:none; font-family: "Segoe UI", sans-serif; font-size: 12px; }

  /* ---------- phone + themes ---------- */
  .phone { --paper:#000; --ink:#fff; --dim:#7a7a7a; --faint:#262626; --font: "Segoe UI", Roboto, sans-serif;
           width: 340px; height: 736px; border-radius: 44px; background: var(--paper); color: var(--ink); border: 1px solid #333;
           box-shadow: 0 0 0 8px #0a0a0a, 0 0 0 9px #2a2a2a, 0 30px 80px rgba(0,0,0,.6);
           position: relative; overflow: hidden; display:flex; flex-direction:column; font-family: var(--font); }
  .phone.light { --paper:#fff; --ink:#000; --dim:#8c8c8c; --faint:#e0e0e0; border-color:#ccc; }
  .phone.serif { --font: Georgia, "Times New Roman", serif; }
  .phone.condensed { --font: "Arial Narrow", "Roboto Condensed", "Segoe UI", sans-serif; }
  .sysbar { height: 34px; display:flex; justify-content:space-between; align-items:center; padding: 0 26px; font-size: 12px; color: var(--ink); opacity:.85; font-family: "Segoe UI", sans-serif; }
  .notch { position:absolute; top:10px; left:50%; transform:translateX(-50%); width: 14px; height: 14px; border-radius:50%; background:#111; border:1px solid #333; }
  .screen { flex:1; display:flex; flex-direction:column; padding: 8px 26px 10px; min-height: 0; }
  .navbar { height: 22px; display:flex; justify-content:center; align-items:center; }
  .navbar i { width: 110px; height: 4px; border-radius: 2px; background: var(--dim); }

  .label { font-family: Consolas, "Courier New", monospace; font-size: 10px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
  .label.ink { color: var(--ink); opacity:.85; }
  .body { color: var(--dim); font-size: 14px; line-height: 21px; }
  .center { text-align:center; }
  .spacer { flex: 1; }
  .status { display:flex; justify-content:space-between; }

  .clockwrap { display:flex; justify-content:center; margin-top: 24px; }
  .face { position:relative; width: 226px; height: 226px; }
  .face svg { position:absolute; inset:0; }
  .face .center-text { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 2px; }
  .digits { font-weight: 100; font-variant-numeric: tabular-nums; letter-spacing: -1px; }

  .msg { height: 40px; display:flex; align-items:center; justify-content:center; margin-top: 12px; }

  .fav { display:flex; align-items:center; gap: 18px; padding: 7px 0; }
  .fav .n { font-family: Consolas, monospace; font-size: 10px; color: var(--dim); }
  .fav .t { font-size: 22px; font-weight: 300; }

  .dock { display:flex; justify-content:space-between; align-items:center; padding: 0 10px; margin-top: 22px; }
  .dbtn { width: 56px; height: 56px; border-radius:50%; border: 1px solid var(--faint); display:flex; align-items:center; justify-content:center; color: var(--ink); }
  .focus { width: 82px; height: 82px; border-radius:50%; border: 1px solid var(--faint); padding: 7px; }
  .focus > div { width:100%; height:100%; border-radius:50%; border:1px solid var(--ink); display:flex; align-items:center; justify-content:center; color: var(--ink); }
  .hint { height: 34px; display:flex; align-items:center; justify-content:center; color: var(--dim); }

  /* ---------- drawer ---------- */
  .handle { height: 28px; display:flex; align-items:center; justify-content:center; }
  .handle i { width: 36px; height: 3px; border-radius:2px; background: var(--faint); }
  .search { display:flex; align-items:center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--faint); color: var(--dim); }
  .search .label { flex:1; }
  .list { flex:1; display:flex; gap: 6px; overflow:hidden; margin-top: 2px; position: relative; }
  .apps { flex:1; }
  .hdr { font-family: Consolas, monospace; font-size: 11px; color: var(--dim); padding: 16px 0 3px; }
  .app { display:flex; align-items:center; gap: 16px; padding: 8px 0; font-size: 16px; }
  .ico { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(145deg,#5a5a5a,#2c2c2c); display:flex; align-items:center; justify-content:center; font-size: 13px; color:#ddd; font-weight:600; flex: none; }
  .ico.sq { border-radius: 9px; }
  .pin { width: 4px; height: 4px; border-radius:50%; background: var(--ink); margin-left:auto; }
  .scrub { width: 22px; display:flex; flex-direction:column; justify-content:space-between; align-items:center; padding: 10px 0 14px; font-family: Consolas, monospace; font-size: 9px; color: var(--dim); }
  .scrub b { color: var(--ink); font-weight: 400; }
  .bubble { position:absolute; left: 50%; top: 46%; transform: translate(-50%,-50%); width: 70px; height: 70px; border-radius:50%; border: 1px solid var(--ink); background: var(--paper);
            display:flex; align-items:center; justify-content:center; font-size: 28px; font-weight: 300; }

  /* ---------- sheets ---------- */
  .sheethead { display:flex; justify-content:space-between; align-items:center; margin-top: 6px; }
  .wordmark { font-size: 19px; font-weight: 600; }
  .picker { display:flex; align-items:center; justify-content:center; gap: 6px; }
  .round { width: 42px; height: 42px; border-radius:50%; border: 1px solid var(--faint); display:flex; align-items:center; justify-content:center; font-size: 20px; font-weight: 300; }
  .chips { display:flex; gap: 6px; }
  .chip { flex:1; height: 36px; border: 1px solid var(--faint); display:flex; align-items:center; justify-content:center; font-family: Consolas, monospace; font-size: 11px; color: var(--dim); white-space:nowrap; }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .primary { height: 52px; background: var(--ink); color: var(--paper); display:flex; align-items:center; justify-content:center;
             font-family: Consolas, monospace; font-size: 12px; letter-spacing: 3px; font-weight: 600; }

  /* ---------- settings ---------- */
  .settings { overflow:hidden; }
  .sec { margin-top: 22px; }
  .sec > .label { color: var(--ink); display:block; padding-bottom: 6px; border-bottom: 1px solid var(--faint); }
  .cap { color: var(--dim); font-size: 12px; margin: 14px 0 7px; }
  .fonts { display:flex; gap: 5px; }
  .fonts div { flex:1; border:1px solid var(--faint); padding: 7px 0 6px; text-align:center; }
  .fonts div b { display:block; font-weight: 400; font-size: 20px; line-height: 1.2; }
  .fonts div i { display:block; font-style: normal; font-family: Consolas, monospace; font-size: 7.5px; letter-spacing: .5px; color: var(--dim); margin-top: 2px; }
  .fonts div.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .fonts div.on i { color: var(--paper); }
  .trow { display:flex; align-items:center; padding: 10px 0; gap: 12px; }
  .trow .tt { flex:1; font-size: 15px; }
  .trow .tt small { display:block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .trow .val { color: var(--dim); font-size: 12px; }
  .chev { color: var(--dim); font-size: 18px; line-height: 1; }
  .sw { width: 44px; height: 24px; border-radius: 12px; border: 1px solid var(--faint); padding: 2px; flex: none; }
  .sw i { display:block; width: 18px; height: 18px; border-radius: 50%; background: var(--dim); }
  .sw.on { border-color: var(--ink); }
  .sw.on i { background: var(--ink); margin-left: 20px; }
  .about { border: 1px solid var(--faint); padding: 18px; text-align:center; margin-top: 12px; }
  .about .wm { font-size: 26px; font-weight: 600; margin-top: 10px; }
  .about .by { font-size: 15px; font-weight: 300; margin-top: 2px; }
  .check { width: 20px; height: 20px; border: 1px solid var(--dim); flex: none; display:flex; align-items:center; justify-content:center; }
  .check.on { background: var(--ink); border-color: var(--ink); color: var(--paper); font-size: 13px; }
  .fade-bottom { position:absolute; left:0; right:0; bottom: 22px; height: 60px; background: linear-gradient(transparent, var(--paper)); pointer-events:none; }

  /* ---------- new: overlays, dialogs, wellbeing ---------- */
  .sos { border: 1px solid var(--ink); border-radius: 12px; padding: 2px 10px; font-family: Consolas, monospace; font-size: 10px; letter-spacing: 2px; font-weight: 700; margin-left: 10px; }
  .scrim2 { position:absolute; inset:0; background: rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center; padding: 22px; }
  .dialog { width: 100%; background: var(--paper); border: 1px solid var(--ink); padding: 22px; }
  .dialog h3 { font-weight: 300; font-size: 21px; margin-bottom: 12px; }
  .field { border-bottom: 1px solid var(--faint); padding: 9px 0; font-family: Consolas, monospace; font-size: 16px; letter-spacing: 3px; }
  .btns { display:flex; gap: 10px; margin-top: 20px; }
  .btns > div { flex:1; height: 48px; display:flex; align-items:center; justify-content:center; font-family: Consolas, monospace; font-size: 11px; letter-spacing: 3px; font-weight: 600; }
  .btn-o { border: 1px solid var(--ink); }
  .btn-p { background: var(--ink); color: var(--paper); }
  .outline { height: 50px; border: 1px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family: Consolas, monospace; font-size: 11px; letter-spacing: 3px; font-weight: 600; }
  .hero { font-weight: 100; font-size: 54px; line-height: 1; font-variant-numeric: tabular-nums; }
  .wall { background: radial-gradient(circle at 30% 20%, #3a3a3a, #121212 70%); }
  .widget { margin: 40px 18px 0; border-radius: 22px; background:#000; border: 1px solid #333; padding: 16px; color:#fff; }
  .launcher-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 22px 0; padding: 30px 18px 0; justify-items:center; }
  .launcher-grid i { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(145deg,#5a5a5a,#2c2c2c); display:block; }
  .dots { display:flex; justify-content:center; gap: 8px; margin-bottom: 18px; }
  .dots i { width: 6px; height: 6px; border-radius:50%; border:1px solid var(--dim); }
  .dots i.on { width: 8px; height: 8px; background: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

      <div class="spacer"></div>
      <div class="navbar"><i style="background:#888"></i></div>
    </div>
    <figcaption>21 · Widget<span>For other launchers · live countdown, or today's focus when idle</span></figcaption>
  </figure>

</div>

<script>
  const NS = "http://www.w3.org/2000/svg";

  // Stats bars: thin bars, 4px rounded tops on the baseline, dashed goal line.
  document.querySelectorAll(".bars").forEach(el => {
    const mins = el.dataset.bars.split(",").map(Number), goal = +el.dataset.goal, sel = +el.dataset.sel;
    const W = 288, H = 130, base = H - 1, max = Math.max(...mins, goal) * 1.15, slot = W / mins.length, bw = Math.min(slot * .36, 18), r = 4;
    let s = "";
    mins.forEach((m, i) => {
      if (m <= 0) return;
      const h = m / max * base, x = slot * i + (slot - bw) / 2, y = base - h;
      s += `<path d="M${x} ${base} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + bw - r} Q${x + bw} ${y} ${x + bw} ${y + r} V${base} Z" fill="${i === sel ? '#fff' : 'rgba(255,255,255,.55)'}"/>`;
    });
    s += `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#262626"/>`;
    const gy = base - goal / max * base;
    s += `<line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="#7a7a7a" stroke-dasharray="6 6"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${s}</svg>`;
  });
  const PAL = { dark: { ink:"#fff", dim:"#7a7a7a", faint:"#262626", paper:"#000" },
                light:{ ink:"#000", dim:"#8c8c8c", faint:"#e0e0e0", paper:"#fff" } };
  const rgba = (hex, a) => { const v = hex === "#fff" ? 255 : 0; return `rgba(${v},${v},${v},${a})`; };
  const pt = (c, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [c + Math.cos(a) * r, c + Math.sin(a) * r]; };
  const glow = (p, x, y, k = 1) =>
    `<circle cx="${x}" cy="${y}" r="${12*k}" fill="${rgba(p.ink,.08)}"/><circle cx="${x}" cy="${y}" r="${6*k}" fill="${rgba(p.ink,.22)}"/><circle cx="${x}" cy="${y}" r="${2.5*k}" fill="${p.ink}"/>`;

  function ring(p, size, f) {
    const c = size / 2, outer = c - 2, lit = Math.floor(f * 60), s = size / 226;
    let h = "";
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0, len = (major ? 12 : 6) * s;
      const col = i < lit ? (major ? p.ink : rgba(p.ink, .7)) : (major ? rgba(p.dim === "#7a7a7a" ? "#fff" : "#000", .35) : p.faint);
      const [x1, y1] = pt(c, outer - len, i * 6), [x2, y2] = pt(c, outer, i * 6);
      h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${major ? 2 : 1}" stroke-linecap="round"/>`;
    }
    const orbit = outer - 22 * s;
    h += `<circle cx="${c}" cy="${c}" r="${orbit - 8 * s}" fill="none" stroke="${p.faint}"/>`;
    const [dx, dy] = pt(c, orbit, f * 360);
    return h + glow(p, dx, dy, s);
  }

  function analog(p, size, hh, mm, ss) {
    const c = size / 2, outer = c - 2, s = size / 226;
    let h = "";
    for (let i = 0; i < 60; i++) {
      const major = i % 5 === 0, len = (major ? 14 : 5) * s;
      const [x1, y1] = pt(c, outer - len, i * 6), [x2, y2] = pt(c, outer, i * 6);
      h += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${major ? p.ink : p.faint}" stroke-width="${major ? 2 : 1}" stroke-linecap="round"/>`;
    }
    const hand = (deg, len, w, col, tail = 0) => {
      const [x1, y1] = pt(c, -tail, deg), [x2, y2] = pt(c, len, deg);
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
    };
    h += hand(((hh % 12) + mm / 60) * 30, outer * .5, 3, p.ink);
    h += hand((mm + ss / 60) * 6, outer * .78, 1.6, p.ink);
    h += hand(ss * 6, outer * .88, 1, p.dim, outer * .16);
    h += `<circle cx="${c}" cy="${c}" r="4.5" fill="${p.ink}"/><circle cx="${c}" cy="${c}" r="1.6" fill="${p.paper}"/>`;
    return h;
  }

  function orbit(p, size, hh, mm, ss) {
    const c = size / 2, outer = c - 8, gap = 16;
    const rings = [[outer, ss / 60, p.dim], [outer - gap, (mm + ss / 60) / 60, p.ink], [outer - 2 * gap, ((hh % 12) + mm / 60) / 12, p.ink]];
    let h = "";
    rings.forEach(([r, f, col]) => {
      h += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${p.faint}"/>`;
      const [ex, ey] = pt(c, r, f * 360), large = f > .5 ? 1 : 0;
      h += `<path d="M ${c} ${c - r} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
      h += glow(p, ex, ey, .7);
    });
    return h;
  }

  document.querySelectorAll(".face[data-face]").forEach(el => {
    const p = el.closest(".phone").classList.contains("light") ? PAL.light : PAL.dark;
    const size = el.offsetWidth || 226;
    const [hh, mm, ss] = (el.dataset.time || "0:0:0").split(":").map(Number);
    let inner;
    switch (el.dataset.face) {
      case "ring":   inner = ring(p, size, el.dataset.fraction ? parseFloat(el.dataset.fraction) : ss / 60); break;
      case "analog": inner = analog(p, size, hh, mm, ss); break;
      case "orbit":  inner = orbit(p, size, hh, mm, ss); break;
    }
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.innerHTML = inner;
    el.prepend(svg);
  });

  // Line glyphs (currentColor follows the theme)
  const glyphs = {
    power: `<svg width="26" height="26" viewBox="0 0 26 26"><path d="M7.5 5.3 A10.2 10.2 0 1 0 18.5 5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="13" y1="1.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    chat: `<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.6" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="5.2" y1="18.8" x2="1.6" y2="22.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
    phone: `<svg width="22" height="22" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
    lock: `<svg width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></svg>`,
    up: `<svg width="28" height="28" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    search: `<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="15.5" y1="15.5" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    close: `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
    gear: `<svg width="19" height="19" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="6.8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`,
  };
  document.querySelectorAll("[data-glyph]").forEach(el => el.innerHTML = glyphs[el.dataset.glyph]);
</script>
</body>
</html>
